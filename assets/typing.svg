<svg width="600" height="40" viewBox="0 0 600 40" xmlns="http://www.w3.org/2000/svg">
<style>
text { font-family: monospace; font-size: 20px; font-weight: 600; fill: #6366F1; }
.line { opacity: 0; }
.g1 { animation: appear 12s linear infinite; }
.g2 { animation: appear 12s linear infinite; animation-delay: 3s; }
.g3 { animation: appear 12s linear infinite; animation-delay: 6s; }
.g4 { animation: appear 12s linear infinite; animation-delay: 9s; }
@keyframes appear {
0% { opacity: 1; }
22% { opacity: 1; }
24% { opacity: 0; }
100% { opacity: 0; }
}
</style>
<text class="line g1" x="20" y="25">Third Year B.Tech CSE Student</text>
<text class="line g2" x="20" y="25">AI ML Enthusiasts| Python Developer</text>
</svg>
