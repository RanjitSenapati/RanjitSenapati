<svg width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: url(#bgGrad); }
    .wave {
      fill: rgba(0,0,0,0.18);
      transform-origin: 600px 200px;
      animation: sway 6s ease-in-out infinite;
    }
    @keyframes sway {
      0%   { transform: translateY(0px); }
      50%  { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .title {
      fill: #ffffff;
      font-family: Segoe UI, Verdana, sans-serif;
      font-size: 48px;
      font-weight: 700;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.2s forwards;
    }
    .subtitle {
      fill: #e8f2f0;
      font-family: Segoe UI, Verdana, sans-serif;
      font-size: 18px;
      font-weight: 500;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.8s forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F8C7A"/>
      <stop offset="100%" stop-color="#1B4B6B"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1200" height="200"/>

  <path class="wave" d="M0,170 C300,140 900,200 1200,160 L1200,200 L0,200 Z"/>

  <text class="title" x="600" y="95" text-anchor="middle">Ranjit Senapati</text>
  <text class="subtitle" x="600" y="135" text-anchor="middle">Real-Time Computer Vision &amp; AI Systems</text>
</svg>
