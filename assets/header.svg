<svg width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F8C7A"/>
      <stop offset="100%" stop-color="#1B4B6B"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="200" fill="url(#bgGrad)"/>

  <path fill="url(#waveGrad)">
    <animate attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="
        M0,170 C300,140 900,200 1200,160 L1200,200 L0,200 Z;
        M0,160 C300,200 900,140 1200,170 L1200,200 L0,200 Z;
        M0,170 C300,140 900,200 1200,160 L1200,200 L0,200 Z
      "/>
  </path>

  <text x="600" y="95" font-family="Segoe UI, Verdana, sans-serif" font-size="48" font-weight="700"
        fill="#ffffff" text-anchor="middle" opacity="0">
    Ranjit Senapati
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="1s" fill="freeze"/>
  </text>

  <text x="600" y="135" font-family="Segoe UI, Verdana, sans-serif" font-size="18" font-weight="500"
        fill="#e8f2f0" text-anchor="middle" opacity="0">
    Real-Time Computer Vision &amp; AI Systems
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1s" fill="freeze"/>
  </text>
</svg>
